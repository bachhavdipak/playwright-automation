trigger:
  - main

variables:
  runSonar: true
  sonarServiceConnection: 'Specsavers IT - SonarCloud - Prod'
  sqProjectName: ${{ lower(variables['System.TeamProject']) }}-$(Build.Repository.Name)
  sqProjectKey: specsavers_${{ lower(variables['System.TeamProject']) }}:$(Build.Repository.Name)

stages:
  - stage: Run_all_regression_tests
    jobs:
      - job: Run_regression_against_API
        timeoutInMinutes: 300
        pool:
          name: Self-Hosted-Agents-Prod
        container:
          endpoint: ACR - Corp - Non-Prod - Docker
          image: acrem4ddave001.azurecr.io/mcr.microsoft.com/playwright:v1.51.0-jammy
        continueOnError: true
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18'
            displayName: 'Install Node.js'

            # Download and Install JDK 17 (Eclipse Temurin)
          - script: |
              echo "Downloading JDK 17 (Eclipse Temurin)..."
              curl -L -o jdk17.tar.gz https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.10%2B7/OpenJDK17U-jdk_x64_linux_hotspot_17.0.10_7.tar.gz
              echo "Extracting JDK 17..."
              mkdir -p $(Agent.ToolsDirectory)/jdk17
              tar -xzf jdk17.tar.gz -C $(Agent.ToolsDirectory)/jdk17 --strip-components=1
              echo "##vso[task.setvariable variable=JAVA_HOME]$(Agent.ToolsDirectory)/jdk17"
              echo "JDK 17 installed successfully!"
            displayName: 'Download and Install JDK 17'

          # Set JAVA_HOME variable to point to the installed JDK 17
          - script: |
              echo "JAVA_HOME is set to: $(JAVA_HOME)"
            displayName: 'Verify JAVA_HOME'

          - ${{ if eq(variables.runSonar, 'true') }}:
              - task: SonarCloudPrepare@3
                displayName: SonarCloud Prepare
                inputs:
                  SonarCloud: '$(sonarServiceConnection)'
                  organization: 'specsavers'
                  scannerMode: 'CLI'
                  configMode: 'manual'
                  cliProjectName: '$(sqProjectName)'
                  cliProjectKey: '$(sqProjectKey)'

          - script: npm ci
            displayName: 'npm ci'
          - script: |
              npx cross-env PROJECT=platform ENVIRONMENT=platform-uk npx playwright test
            displayName: 'Run API tests'

          - ${{ if eq(variables.runSonar, 'true') }}:
              - task: SonarCloudAnalyze@3
                displayName: SonarCloud Analyze
                env:
                  JAVA_HOME: $(JAVA_HOME) # Use the JAVA_HOME set for JDK 17

              - task: SonarCloudPublish@3
                displayName: SonarCloud Publish
                inputs:
                  pollingTimeoutSec: '300'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: playwright-report
              artifact: playwright-report-api
              publishLocation: 'pipeline'
            condition: succeededOrFailed()
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            inputs:
              searchFolder: 'test-results'
              testResultsFormat: 'JUnit'
              testResultsFiles: 'junit-results.xml'
              mergeTestResults: true
              testRunTitle: 'Playwright Tests'
            condition: succeededOrFailed()

      - job: Run_regression_against_UI
        timeoutInMinutes: 300
        pool:
          name: Self-Hosted-Agents-Prod
        container:
          endpoint: ACR - Corp - Non-Prod - Docker
          image: acrem4ddave001.azurecr.io/mcr.microsoft.com/playwright:v1.51.0-jammy
        continueOnError: true
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18'
            displayName: 'Install Node.js'
          - script: npm ci
            displayName: 'npm ci'
          - script: npx cross-env PROJECT=duckduckgo ENVIRONMENT=uat-uk npx playwright test
            displayName: 'Run Playwright UI tests'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: playwright-report
              artifact: playwright-report-ui
              publishLocation: 'pipeline'
            condition: succeededOrFailed()
          - task: PublishTestResults@2
            displayName: 'Publish test results'
            inputs:
              searchFolder: 'test-results'
              testResultsFormat: 'JUnit'
              testResultsFiles: 'junit-results.xml'
              mergeTestResults: true
              testRunTitle: 'Playwright Tests'
            condition: succeededOrFailed()
